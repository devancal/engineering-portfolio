name: Portfolio RL showcase migration

on:
  push:
    paths:
      - '.github/workflows/portfolio-rl-patch.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace InternAI portfolio entry with RL progression
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          rl_card = '''<article class="project-card" data-category="code" data-project="rl"><a class="project-visual code-visual rl-visual" href="#project-rl" aria-label="Reinforcement learning agents project"><span class="visual-id">07 / REINFORCEMENT LEARNING</span><div class="rl-art" aria-hidden="true"><div class="rl-path"><span><b>01</b> CONTROL<small>CartPole · trained</small></span><i>→</i><span><b>02</b> LANDING<small>LunarLander · in development</small></span><i>→</i><span><b>03</b> NAVIGATION<small>Maze · in development</small></span><i>→</i><span class="rl-racer"><b>04</b> RACING<small>Active development</small></span></div></div><span class="placeholder-label"><span aria-hidden="true">◈</span> Control → landing → navigation → racing</span></a><div class="project-copy"><div class="project-topline"><span class="eyebrow">PYTHON / REINFORCEMENT LEARNING</span><span>IN PROGRESS</span></div><h3><a href="#project-rl">Reinforcement Learning<br>Agents</a></h3><p>A progression of reinforcement-learning projects, starting with basic control and building toward an autonomous racing agent with increasingly complex observations, actions, and reward design.</p><div class="tags"><span>Python</span><span>Q-Learning</span><span>Reinforcement Learning</span></div><a class="text-link" href="#project-rl">Inside the project <span aria-hidden="true">↗</span></a></div></article>'''
          pattern = r'<article class="project-card" data-category="code"><a class="project-visual code-visual" href="#project-code".*?</article>'
          s, n = re.subn(pattern, rl_card, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one InternAI card, replaced {n}')
          p.write_text(s, encoding='utf-8')

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          rl_obj = r'''},
'project-rl':{k:'07 / REINFORCEMENT LEARNING',d:'IN PROGRESS',t:'Reinforcement Learning Agents',lead:'A progression of reinforcement-learning projects built to learn increasingly complex control problems—from balancing a pole to developing an autonomous racing agent.',role:'Personal learning projects',tools:'Python · Gymnasium · Q-Learning · RL',focus:'Control · learning · reward design',left:'<p><strong>Progression.</strong> I am using a sequence of increasingly difficult environments to build practical reinforcement-learning experience rather than treating each exercise as an unrelated project. The progression is control → landing → navigation → racing.</p><div class="rl-stage-list"><div><strong>01 · CartPole</strong><span>TRAINED</span><p>Tabular Q-learning with a discretized state space. After 20,000 training episodes, the trained policy averaged 461.0 steps across 10 evaluation runs, with a best of 500 and worst of 260.</p></div><div><strong>02 · LunarLander</strong><span>IN DEVELOPMENT</span><p>The next step in the progression, moving beyond the simpler CartPole control problem into a larger observation and action space.</p></div></div>',right:'<div class="rl-stage-list"><div><strong>03 · Maze Navigation</strong><span>IN DEVELOPMENT</span><p>A navigation project intended to explore learning a policy through an environment where exploration and route selection matter.</p></div><div class="rl-stage-feature"><strong>04 · Autonomous Racing Agent</strong><span>ACTIVE DEVELOPMENT</span><p>The long-term application project. I am experimenting with vehicle observations and sensors, steering and throttle behavior, reward design, and training stability. The current agent is still under development, so I am not presenting unfinished behavior as a successful result.</p></div></div>',note:'The value of this series is the progression. CartPole provides a completed baseline with measurable evaluation results; LunarLander and the maze create intermediate learning steps; and the racing agent is where I am trying to apply those ideas to a more complex control problem. I will replace the in-progress states with actual training results and visuals as each agent is completed.'}'''
          marker = "}}\nfunction projectView"
          if marker not in s:
              raise SystemExit('Could not find project object boundary')
          s = s.replace(marker, rl_obj + "}\nfunction projectView", 1)
          s = s.replace('Trading Strategy & Indicator Development · InternAI', 'Trading Strategy & Indicator Development · Reinforcement Learning Agents')
          s = s.replace("internId.textContent='07 / SOFTWARE PROJECT'", "internId.textContent='07 / REINFORCEMENT LEARNING'")
          s = s.replace("'Engineering computation · web development · debugging · quantitative scripting'", "'Engineering computation · reinforcement learning · debugging · quantitative scripting'")
          p.write_text(s, encoding='utf-8')

          p = Path('header-fix.css')
          s = p.read_text(encoding='utf-8')
          css = r'''

/* Reinforcement-learning progression */
.rl-visual{background:#202c2b;color:#eef2ec;overflow:hidden}
.rl-visual .visual-id,.rl-visual .placeholder-label{color:#dce6df}
.rl-art{position:absolute;inset:0;display:flex;align-items:center;padding:58px 30px 45px;background-image:linear-gradient(#8ca0940d 1px,transparent 1px),linear-gradient(90deg,#8ca0940d 1px,transparent 1px);background-size:24px 24px}
.rl-path{width:100%;display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1.12fr;align-items:center;gap:10px}
.rl-path>span{min-width:0;border:1px solid #718078;padding:16px 12px;background:#253331}
.rl-path>span b{display:block;font:9px var(--mono);letter-spacing:1.2px;color:#e99180;margin-bottom:8px}
.rl-path>span small{display:block;margin-top:7px;font:7px/1.4 var(--mono);color:#9fb0a5}
.rl-path>i{font-style:normal;color:#899a90;font-size:17px}
.rl-path .rl-racer{border-color:#bc382a;background:#2b3633}
.rl-stage-list{display:grid;gap:12px}
.rl-stage-list>div{border:1px solid var(--line);padding:15px 16px}
.rl-stage-list strong{display:block;font-size:13px;font-weight:600}
.rl-stage-list span{display:inline-block;margin:7px 0 9px;font:8px var(--mono);letter-spacing:1px;color:var(--accent)}
.rl-stage-list p{font-size:11px;line-height:1.75;color:var(--muted)}
.rl-stage-feature{border-color:#b7beb7!important;background:#eeefe9}
@media(max-width:760px){.rl-art{padding:52px 15px 40px}.rl-path{grid-template-columns:1fr 1fr;gap:8px}.rl-path>i{display:none}.rl-path>span{padding:11px 9px}.rl-path>span small{font-size:6px}.rl-visual .placeholder-label{font-size:6.5px}}
'''
          if '/* Reinforcement-learning progression */' not in s:
              s += css
          p.write_text(s, encoding='utf-8')

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js header-fix.css
          git commit -m "Replace InternAI portfolio entry with RL progression"
          git push
